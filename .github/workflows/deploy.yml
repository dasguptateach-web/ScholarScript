name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: marketing
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e .
      - name: Auto-discover YouTube videos for new papers
        run: |
          pip install yt-dlp
          python youtube_agent.py
        continue-on-error: true
      - run: |
          python -m scholarscript build
          cp indexnow-key.txt public/indexnow-key.txt
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Auto-promote new content (Bluesky, IndexNow, social drafts)
        env:
          SITE_URL: "https://dasguptateach-web.github.io/ScholarScript"
          SITE_NAME: "ScholarScript"
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          pip install httpx
          python .github/scripts/marketing_agent.py
        continue-on-error: true

      - name: Commit marketing state
        run: |
          git config user.email "scholarscript@users.noreply.github.com"
          git config user.name "ScholarScript Bot"
          git add .marketing-state.json social-posts/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Marketing agent update [skip ci]"
          for i in 1 2 3; do
            git fetch origin main
            git merge -X ours origin/main --no-edit || git merge --abort || true
            if git push origin HEAD:main; then exit 0; fi
            sleep 10
          done
          exit 1
        continue-on-error: true
