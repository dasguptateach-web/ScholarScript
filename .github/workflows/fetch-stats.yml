name: Fetch Visitor Stats
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch stats from GoatCounter API
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python .github/scripts/fetch_stats.py
      - name: Commit and push
        run: |
          git config user.name 'ScholarScript Bot'
          git config user.email 'bot@scholarscript.org'
          git add data/visitor-stats.json
          git diff --staged --quiet || git commit -m "Update visitor stats [skip ci]"
          git push
